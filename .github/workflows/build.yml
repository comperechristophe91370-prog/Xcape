name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Locate and unzip project archive (if uploaded as a .zip)
        run: |
          set -e
          if [ -d "app" ] && [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
            if [ -z "$ZIP_FILE" ]; then
              echo "Aucun projet ni zip trouve a la racine du depot."
              exit 1
            fi
            unzip -q "$ZIP_FILE" -d extracted
            PROJECT_DIR=$(find extracted -maxdepth 2 -iname "settings.gradle.kts" -exec dirname {} \;)
            if [ -z "$PROJECT_DIR" ]; then
              echo "settings.gradle.kts introuvable dans l'archive."
              exit 1
            fi
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XCapeDashboard-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
